<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2">
<meta name="format-detection" content="telephone=no">
<title>/*__TITLE__*/</title>
<style>/*__CSS__*/</style>
<style>
/* 索引页专用：年份分卷入口 */
.volgrid{overflow:hidden;margin:8px 0 6px}
.vol{display:block;float:left;width:31.3%;margin:0 2% 12px 0;padding:14px 15px;
  background:#fff;border:1px solid #e4e2dd;border-radius:11px;color:#1f2328}
.vol:nth-child(3n){margin-right:0}
.vol b{display:block;font-size:21px;font-weight:650;letter-spacing:-.3px;line-height:1.3}
.vol .rng{display:block;font-size:12.5px;color:#8a929c;margin-top:2px}
.vol .cnt{display:block;font-size:13px;color:#5b6570;margin-top:8px}
.vol .bar2{height:4px;border-radius:3px;background:#eeece7;margin-top:9px;overflow:hidden}
.vol .bar2 i{display:block;height:100%;background:#b45309}
.sec-h{font-size:16px;font-weight:650;margin:34px 0 12px}
.note{font-size:13px;color:#5b6570;background:#faf9f6;border:1px dashed #e4e2dd;
  border-radius:8px;padding:11px 14px;margin:14px 0 0;line-height:1.7}
@media (max-width:640px){
  .vol{float:none;width:auto;margin-right:0}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>科技爱好者集锦</h1>
  <p class="sub">/*__SUB__*/</p>
</header>

<h2 class="sec-h">按年份分卷</h2>
<div class="volgrid">/*__VOLS__*/</div>

<p class="note">/*__NOTE__*/</p>

<h2 class="sec-h">最近收录</h2>
<div id="recent">/*__RECENT__*/</div>

</div>
