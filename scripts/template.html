<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2">
<meta name="format-detection" content="telephone=no">
<title>/*__TITLE__*/</title>
<style>
/* 兼容取向：不使用 CSS 变量、网格布局、吸顶定位、毛玻璃滤镜，均给出降级方案 */
*{box-sizing:border-box;-webkit-box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#f6f6f4;color:#1f2328;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.75;word-wrap:break-word;-webkit-tap-highlight-color:rgba(0,0,0,.06)}
a{color:#1d4ed8;text-decoration:none}
a:hover{text-decoration:underline}
code{background:#f0efeb;padding:1px 5px;border-radius:4px;font-size:.88em}
.wrap{max-width:940px;margin:0 auto;padding:0 20px 70px}

header{padding:34px 0 22px;border-bottom:1px solid #e4e2dd;margin-bottom:22px}
h1{font-size:27px;line-height:1.35;margin:0 0 10px;letter-spacing:-.2px}
.sub{color:#5b6570;font-size:14px;margin:0}

/* 年份导航 */
.years{margin:16px 0 0;line-height:2.2}
.years a{display:inline-block;padding:4px 11px;margin:0 6px 6px 0;border:1px solid #ddd9d2;
  background:#fff;border-radius:7px;font-size:13px;color:#5b6570}
.years a.on{background:#1f2328;color:#fff;border-color:#1f2328}
.years a.idx{background:#f0efeb}

/* 工具栏 */
.bar{background:#f3f3f0;border:1px solid #e4e2dd;border-radius:10px;padding:12px;margin-bottom:22px}
.seg{display:inline-block;margin:0 8px 8px 0;vertical-align:middle}
.seg button{border:1px solid #ddd9d2;background:#fff;padding:8px 12px;font-size:13.5px;cursor:pointer;
  color:#5b6570;font-family:inherit;margin-left:-1px;line-height:1.4}
.seg button:first-child{margin-left:0;border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:#1f2328;color:#fff;border-color:#1f2328}
#q{display:block;width:100%;max-width:330px;padding:9px 12px;border:1px solid #ddd9d2;border-radius:8px;
  background:#fff;font-size:14px;font-family:inherit;color:#1f2328;margin:0 0 10px}
#q:focus{outline:none;border-color:#b9b4aa}
.res{font-size:12.5px;color:#8a929c;margin-top:2px}
.res b{color:#b45309}

/* 条目 */
.group{margin:26px 0 0}
.ghead{padding:0 0 9px;border-bottom:1px solid #e4e2dd;margin-bottom:13px;overflow:hidden}
.ghead h3{margin:0;font-size:15.5px;font-weight:650;display:inline}
.ghead .gdesc{font-size:12.5px;color:#8a929c;margin-left:8px}
.ghead .gn{float:right;font-size:12px;color:#8a929c}
.card{background:#fff;border:1px solid #e4e2dd;border-radius:11px;padding:15px 16px;margin-bottom:11px}
.meta{margin-bottom:10px;overflow:hidden}
.iss{display:inline-block;font-size:12px;font-weight:600;background:#f0efeb;color:#5b6570;padding:2px 8px;border-radius:6px}
.date{display:inline-block;font-size:12px;color:#8a929c;margin-left:6px}
.sec2{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:6px;background:#eef2f7;color:#3b5b8c;margin-left:6px}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:20px;color:#fff;font-weight:500;margin:3px 0 0 6px}
.copy{float:right;border:1px solid #ddd9d2;background:#fff;border-radius:7px;
  font-size:11.5px;padding:3px 10px;cursor:pointer;color:#8a929c;font-family:inherit;line-height:1.6}
.copy:active{color:#1f2328}
.title{font-size:15.5px;font-weight:650;margin:0 0 8px;line-height:1.5}
.body p{margin:0 0 9px}
.body p:last-child{margin-bottom:0}
.body .qblock{border-left:3px solid #e4e2dd;padding-left:12px;color:#5b6570}
.quote{background:#faf9f6;border-left:3px solid #b45309;padding:12px 14px;margin:0 0 10px}
.quote p{margin:0 0 8px}
.quote p:last-child{margin-bottom:0}
.take{font-size:13.5px;color:#5b6570;background:#faf9f6;border:1px dashed #e4e2dd;border-radius:8px;padding:8px 12px;margin-top:10px}
.take b{color:#b45309;font-weight:600;margin-right:6px}
.src{font-size:12.5px;color:#8a929c;margin-top:9px}
.src a{color:#1d4ed8}
.empty{text-align:center;padding:50px 0;color:#8a929c;font-size:14px}
footer{margin-top:50px;padding-top:18px;border-top:1px solid #e4e2dd;font-size:12.5px;color:#8a929c;line-height:1.8}
/* 主题色：用 class 代替内联 style，减小文件体积 */
/*__TAGS__*/
@media (max-width:640px){
  .wrap{padding:0 14px 50px}
  h1{font-size:22px}
  #q{max-width:none}
  .gdesc{display:block;margin-left:0;margin-top:2px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>科技爱好者集锦</h1>
  <p class="sub">/*__SUB__*/</p>
  <div class="years">/*__YEARS__*/</div>
</header>

<div class="bar">
  <input id="q" type="search" placeholder="搜索关键词，试试：AI、代码、晋升、开源">
  <div class="seg" id="segSec">
    <button data-v="all" class="on">全部</button>
    <button data-v="文摘">文摘</button>
    <button data-v="言论">言论</button>
  </div>
  <div class="seg" id="segView">
    <button data-v="theme" class="on">按主题</button>
    <button data-v="issue">按期号</button>
  </div>
  <div class="res" id="res"></div>
</div>

<div id="listTheme">/*__LIST__*/</div>
<div id="listIssue" style="display:none">/*__IGROUPS__*/</div>
<div id="themeEmpty" class="empty" style="display:none">没有匹配的条目，换个关键词试试。</div>

<footer>
  /*__FOOTER__*/<br>
  原文版权归原作者及周刊所有，本页仅作摘录、归类与阅读整理；「提炼」与主题标签为整理者所加，不代表原作者观点。<br>
  正文为静态内容，不依赖脚本即可阅读；搜索、筛选与「按期号」视图为脚本增强功能，点击卡片右上角「复制」可复制原文与出处。
</footer>
</div>

<script>
/* ES5：不使用 let/const、箭头函数、模板字符串、Set、Element.closest */
/* 正文全部静态预渲染；本脚本不含任何数据，只负责搜索、筛选、按期号视图与复制 */
function $(s){ return document.querySelector(s); }
function esc(s){
  s = s || "";
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function trim(s){ return String(s || "").replace(/^\s+|\s+$/g, ""); }
function txt(el){
  var t = el.textContent;
  if (t === null || typeof t === "undefined") t = el.innerText;
  return String(t || "");
}
function childByClass(parent, cls){
  var ns = parent.childNodes;
  for (var i = 0; i < ns.length; i++){
    if (ns[i].nodeType === 1 && ns[i].className === cls) return ns[i];
  }
  return null;
}
function kidsByClass(parent, cls){
  var out = [], ns = parent.childNodes;
  for (var i = 0; i < ns.length; i++){
    if (ns[i].nodeType === 1 && ns[i].className === cls) out.push(ns[i]);
  }
  return out;
}
function findOne(parent, tag, cls){
  var els = parent.getElementsByTagName(tag);
  for (var i = 0; i < els.length; i++){ if (els[i].className === cls) return els[i]; }
  return null;
}
function num(el, a){ return parseInt(el.getAttribute(a), 10) || 0; }

var state = { q:"", sec:"all", view:"theme" };

var cards = [];        /* 全部卡片节点（静态渲染） */
var cardText = null;   /* 搜索索引：首次搜索时懒构建，避免拖慢首屏 */
var themeGroups = null;
var issueGroups = {};
var issueOrder = [];
var issueBuilt = false; /* 卡片是否已搬到期号视图 */

(function(){
  var els = document.querySelectorAll("#listTheme .card");
  for (var i = 0; i < els.length; i++) cards.push(els[i]);
  themeGroups = document.querySelectorAll("#listTheme .group");
  var igs = document.querySelectorAll("#listIssue .group");
  for (var j = 0; j < igs.length; j++){
    var n = igs[j].getAttribute("data-iss");
    issueGroups[n] = igs[j];
    issueOrder.push(n);
  }
})();

/* 匹配：直接在静态卡片上判断，不依赖任何 JSON 数据 */
function visibleCards(){
  var kw = trim(state.q).toLowerCase(), sec = state.sec, out = [], i;
  if (kw && !cardText){
    cardText = [];
    for (i = 0; i < cards.length; i++) cardText.push(txt(cards[i]).toLowerCase());
  }
  for (i = 0; i < cards.length; i++){
    var c = cards[i];
    if (sec !== "all" && c.getAttribute("data-s") !== sec) continue;
    if (kw && cardText[i].indexOf(kw) < 0) continue;
    out.push(c);
  }
  return out;
}

/* 排序：期号降序 → 文摘在前 → 序号升序 */
function cmpCard(a, b){
  var ai = num(a, "data-i"), bi = num(b, "data-i");
  if (ai !== bi) return bi - ai;
  var as = a.getAttribute("data-s"), bs = b.getAttribute("data-s");
  if (as !== bs) return as === "文摘" ? -1 : 1;
  return num(a, "data-x") - num(b, "data-x");
}

/* 期号视图：把已存在的卡片节点"搬"过去（不克隆、不重建，老手机更快） */
function moveToIssue(){
  if (issueBuilt) return;
  var buckets = {}, i;
  for (i = 0; i < cards.length; i++){
    var n = cards[i].getAttribute("data-i");
    if (!buckets[n]) buckets[n] = [];
    buckets[n].push(cards[i]);
  }
  for (i = 0; i < issueOrder.length; i++){
    var g = issueGroups[issueOrder[i]], arr = buckets[issueOrder[i]];
    if (!g || !arr) continue;
    arr.sort(cmpCard);
    for (var k = 0; k < arr.length; k++) g.appendChild(arr[k]);
  }
  issueBuilt = true;
}
function moveToTheme(){
  if (!issueBuilt) return;
  var buckets = {}, i;
  for (i = 0; i < cards.length; i++){
    var t = cards[i].getAttribute("data-t");
    if (!buckets[t]) buckets[t] = [];
    buckets[t].push(cards[i]);
  }
  for (i = 0; i < themeGroups.length; i++){
    var grp = themeGroups[i], arr = buckets[grp.getAttribute("data-theme")];
    if (!arr) continue;
    arr.sort(cmpCard);
    for (var k = 0; k < arr.length; k++) grp.appendChild(arr[k]);
  }
  issueBuilt = false;
}

function setCount(grp, n){
  var s = findOne(grp, "span", "gn");
  if (s) s.innerHTML = n + " 条";
}
function countVisible(grp){
  var cs = kidsByClass(grp, "card"), n = 0;
  for (var i = 0; i < cs.length; i++){ if (cs[i].style.display !== "none") n++; }
  return n;
}
function applyVisible(vis, groups, order){
  var keep = {}, i;
  for (i = 0; i < vis.length; i++) keep[vis[i].getAttribute("id")] = 1;
  for (i = 0; i < cards.length; i++){
    cards[i].style.display = keep[cards[i].getAttribute("id")] ? "" : "none";
  }
  var list = [];
  if (order){
    for (i = 0; i < order.length; i++){ if (groups[order[i]]) list.push(groups[order[i]]); }
  } else {
    for (i = 0; i < groups.length; i++) list.push(groups[i]);
  }
  for (i = 0; i < list.length; i++){
    var n = countVisible(list[i]);
    setCount(list[i], n);
    list[i].style.display = n ? "" : "none";
  }
}

function render(){
  var vis = visibleCards();
  var kw = trim(state.q);
  $("#res").innerHTML = "共 <b>" + vis.length + "</b> 条" + (kw ? "（关键词「" + esc(kw) + "」）" : "");
  if (state.view === "issue"){
    moveToIssue();
    $("#listTheme").style.display = "none";
    $("#listIssue").style.display = "";
    applyVisible(vis, issueGroups, issueOrder);
  } else {
    moveToTheme();
    $("#listIssue").style.display = "none";
    $("#listTheme").style.display = "";
    applyVisible(vis, themeGroups, null);
  }
  $("#themeEmpty").style.display = vis.length ? "none" : "";
}

/* 复制：优先 Clipboard API，降级到 execCommand */
function copyDone(btn, ok){
  btn.innerHTML = ok ? "已复制" : "复制失败";
  setTimeout(function(){ btn.innerHTML = "复制"; }, 1500);
}
function copyFallback(t, btn){
  try{
    var ta = document.createElement("textarea");
    ta.value = t;
    ta.setAttribute("readonly", "readonly");
    ta.style.position = "absolute";
    ta.style.left = "-9999px";
    ta.style.fontSize = "16px";
    document.body.appendChild(ta);
    ta.select();
    if (ta.setSelectionRange){ ta.setSelectionRange(0, t.length); }
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    copyDone(btn, ok);
  }catch(e){ copyDone(btn, false); }
}
function doCopy(t, btn){
  if (navigator.clipboard && navigator.clipboard.writeText){
    try{
      navigator.clipboard.writeText(t).then(function(){ copyDone(btn, true); }, function(){ copyFallback(t, btn); });
      return;
    }catch(e){}
  }
  copyFallback(t, btn);
}
function blockText(el){
  if (!el) return "";
  var ps = el.getElementsByTagName("p");
  if (ps && ps.length){
    var a = [];
    for (var i = 0; i < ps.length; i++) a.push(txt(ps[i]));
    return a.join("\n");
  }
  return txt(el);
}
function cardCopyText(card){
  var t = childByClass(card, "title");
  var b = childByClass(card, "body") || childByClass(card, "quote");
  var s = childByClass(card, "src");
  var out = "";
  if (t) out += txt(t) + "\n";
  if (b) out += blockText(b) + "\n";
  if (s) out += txt(s) + "\n";
  return out.replace(/\s+$/, "");
}

function findUp(node, cls){
  while (node && node !== document){
    if (node.className && String(node.className).indexOf(cls) >= 0) return node;
    node = node.parentNode;
  }
  return null;
}
function segHandler(id, k){
  var box = $(id);
  if (!box) return;
  box.onclick = function(e){
    e = e || window.event;
    var el = e.target || e.srcElement;
    if (!el || el.tagName !== "BUTTON") return;
    state[k] = el.getAttribute("data-v");
    var bs = box.getElementsByTagName("button");
    for (var i = 0; i < bs.length; i++){ bs[i].className = (bs[i] === el) ? "on" : ""; }
    render();
  };
}
segHandler("#segSec", "sec");
segHandler("#segView", "view");

/* 搜索防抖：连打时不做全量重排，老手机不卡 */
var timer = null;
function schedule(){
  if (timer) clearTimeout(timer);
  timer = setTimeout(function(){ state.q = qEl.value; render(); }, 220);
}
var qEl = $("#q");
if (qEl){
  qEl.oninput = schedule;
  qEl.onpropertychange = schedule;
}
document.onclick = function(e){
  e = e || window.event;
  var b = findUp(e.target || e.srcElement, "copy");
  if (!b) return;
  var card = findUp(b, "card");
  if (!card) return;
  doCopy(cardCopyText(card), b);
};
document.onkeydown = function(e){
  e = e || window.event;
  var k = e.key || e.keyCode;
  if (k === "/" || k === 191){
    if (qEl && document.activeElement !== qEl){ if (e.preventDefault) e.preventDefault(); qEl.focus(); }
  }
  if (k === "Escape" || k === 27){
    if (qEl){ qEl.value = ""; state.q = ""; render(); }
  }
};

render();
</script>
</body>
</html>
